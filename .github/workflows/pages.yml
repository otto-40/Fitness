name: Test and deploy

# Tests gate every branch and every pull request; only the release branch goes
# on to publish. Both jobs used to be pinned to one branch, so a push anywhere
# else — and every pull request — reached GitHub with nothing run against it.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # one queue per ref, so parallel branches don't cancel each other's runs
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for the test run
        run: node node_modules/playwright-core/cli.js install chromium
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == 'claude/workout-routine-ui-gmzbvt'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
