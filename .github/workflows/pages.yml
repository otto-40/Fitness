name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/workout-routine-ui-gmzbvt]
  pull_request:
    branches: [claude/workout-routine-ui-gmzbvt]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for the test run
        run: node node_modules/playwright-core/cli.js install chromium
      - run: npm test
      - name: Install Overload dependencies
        working-directory: overload
        run: npm ci
      - name: Test Overload
        working-directory: overload
        run: npm test
      - name: Build Overload
        working-directory: overload
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/claude/workout-routine-ui-gmzbvt'
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overload/package-lock.json
      - name: Build Overload
        working-directory: overload
        run: npm ci && npm run build
      # Publish Overload's build output at /overload/ in place of its source.
      - name: Replace Overload source with its build
        run: |
          mv overload/dist "$RUNNER_TEMP/overload"
          rm -rf overload
          mv "$RUNNER_TEMP/overload" overload
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
