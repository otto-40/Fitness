<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Overload: a bigger plate stepping up over a smaller one. Progressive overload, and an O. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5247e6"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <mask id="behind" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="58" cy="43" r="34" fill="#000"/>
    </mask>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g transform="translate(50 50) scale(0.8) translate(-50 -50)">
    <circle cx="35" cy="63" r="17.5" fill="none" stroke="#b9b4ff" stroke-width="11" mask="url(#behind)"/>
    <circle cx="58" cy="43" r="24" fill="none" stroke="#fff" stroke-width="14"/>
    <circle cx="58" cy="43" r="5.5" fill="#fff"/>
  </g>
</svg>
