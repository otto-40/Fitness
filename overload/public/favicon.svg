<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Overload: a bigger plate stepping up over a smaller one. Progressive overload, and an O. Chalk and orange on charcoal. -->
  <defs>
    <mask id="behind" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="58" cy="43" r="34" fill="#000"/>
    </mask>
  </defs>
  <rect width="100" height="100" rx="22" fill="#1d1c1a"/>
  <g transform="translate(50 50) scale(0.8) translate(-50 -50)">
    <circle cx="35" cy="63" r="17.5" fill="none" stroke="#ff7a2e" stroke-width="11" mask="url(#behind)"/>
    <circle cx="58" cy="43" r="24" fill="none" stroke="#f3f2ee" stroke-width="14"/>
    <circle cx="58" cy="43" r="5.5" fill="#f3f2ee"/>
  </g>
</svg>
